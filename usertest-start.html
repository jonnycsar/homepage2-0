<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000}
.w{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,24px);box-sizing:border-box}
.c{width:100%;max-width:min(320px,100%);background:#fff;border-radius:24px;padding:clamp(24px,7vw,36px) clamp(18px,5.5vw,28px);box-sizing:border-box;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.t{font-family:'New Spirit',Newsreader,serif;font-weight:500;font-size:26px;line-height:1.15;letter-spacing:-.022em;color:#0d0d0d;text-wrap:pretty}
.b{font-family:Inter,sans-serif;font-weight:500;font-size:14px;line-height:20px;color:#3c3634;text-wrap:pretty}
.a{margin-top:8px;height:44px;padding:0 26px;border-radius:999px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Inter,sans-serif;font-weight:600;font-size:14px}
</style></head><body><div class="w"><div class="c">
<div class="t" id="t"></div>
<div class="b" id="p1"></div>
<div class="b" id="p2"></div>
<div class="a" id="go"></div>
</div></div>
<script src="i18n.js?v=7"></script>
<script>
var c=(window.usertestCopy&&window.usertestCopy())||{};
document.getElementById('t').textContent=c.t1||'Read this carefully before proceeding';
document.getElementById('p1').textContent=c.p1||c.b1||'';
document.getElementById('p2').textContent=c.p2||'';
document.getElementById('go').textContent=c.cta||'See page';
document.getElementById('go').addEventListener('click',function(){
  var p=new URLSearchParams(location.search),back=p.get('back')||'/';
  try{sessionStorage.setItem('usertest','running');}catch(e){}
  location.replace(back);
});
</script></body></html>
